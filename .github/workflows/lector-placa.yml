# Arma el programa de la placa del Lector (ESP32-S3) cada vez que cambia
# herramientas/lector_placa y lo publica en Releases → "Lector HypokratIA (placa)".
# Se carga en la placa desde Chrome con https://espressif.github.io/esptool-js/
name: Lector HypokratIA (placa)

on:
  push:
    branches: [main]
    paths: ["herramientas/lector_placa/**", "herramientas/lector_pc/atencion.html", ".github/workflows/lector-placa.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  placa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Llave de firma de HypokratIA
        env:
          LLAVE: ${{ secrets.LECTOR_FIRMA_KEY }}
        run: |
          if [ -z "$LLAVE" ]; then
            echo "::error::Falta el secreto LECTOR_FIRMA_KEY (llave de firma del lector)"; exit 1
          fi
          printf '%s\n' "$LLAVE" > herramientas/lector_placa/secure_boot_signing_key.pem
      - name: Compilar (ESP-IDF 5.3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: esp32s3
          path: herramientas/lector_placa
          command: idf.py build && cd build && esptool.py --chip esp32s3 merge_bin -o lector-placa.bin @flash_args
      - name: Borrar la llave
        if: always()
        run: sudo rm -f herramientas/lector_placa/secure_boot_signing_key.pem
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lector-placa
          name: Lector HypokratIA (placa)
          body: |
            Programa para la placa ESP32-S3 del Lector. Bajar **lector-placa.bin**.
            Lector ya cargado: abrir http://172.29.77.1/actualizar y elegir este archivo.
            Lector nuevo: cargarlo desde Chrome en https://espressif.github.io/esptool-js/ (dirección 0x0).
            Firmado por HypokratIA: el lector rechaza archivos sin esta firma.
          files: herramientas/lector_placa/build/lector-placa.bin
          make_latest: false
